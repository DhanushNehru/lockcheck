name: 'lockcheck-action'
description: 'Detect malicious dependency diffs in lock files. Catches supply chain attacks before they catch you.'
author: 'Dhanush Nehru'

branding:
  icon: 'shield'
  color: 'green'

inputs:
  directory:
    description: 'Directory containing package-lock.json'
    required: false
    default: '.'
  strict:
    description: 'Fail on warnings (not just criticals)'
    required: false
    default: 'false'
  no-network:
    description: 'Skip npm registry checks'
    required: false
    default: 'false'

outputs:
  exit-code:
    description: 'Exit code from lockcheck (0 = safe, 1 = issues found)'
  findings:
    description: 'JSON string of all findings'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
      with:
        node-version: '20'

    - name: Run lockcheck
      id: lockcheck
      shell: bash
      env:
        INPUT_DIRECTORY: ${{ inputs.directory }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_NO_NETWORK: ${{ inputs.no-network }}
      run: |
        FLAGS=""
        if [ "$INPUT_STRICT" = "true" ]; then
          FLAGS="$FLAGS --strict"
        fi
        if [ "$INPUT_NO_NETWORK" = "true" ]; then
          FLAGS="$FLAGS --no-network"
        fi

        npx @dhanushnehru/lockcheck@1.0.1 "$INPUT_DIRECTORY" --json $FLAGS > /tmp/lockcheck-results.json 2>&1 || true

        echo "findings=$(cat /tmp/lockcheck-results.json)" >> $GITHUB_OUTPUT

        # Also run with terminal output for the workflow log
        npx @dhanushnehru/lockcheck@latest "$INPUT_DIRECTORY" $FLAGS || EXIT_CODE=$?
        echo "exit-code=${EXIT_CODE:-0}" >> $GITHUB_OUTPUT

        if [ "${EXIT_CODE:-0}" -ne 0 ]; then
          echo "::error::lockcheck detected security issues in your dependencies"
          exit ${EXIT_CODE}
        fi
