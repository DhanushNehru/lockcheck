name: Publish to npm

# Triggers the workflow when a new GitHub release is created
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm (true) or run a dry-run validation (false)'
        required: false
        default: 'false'

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x' # Use your project's Node version
          registry-url: 'https://registry.npmjs.org'
          
      - name: Install dependencies
        run: npm ci

      - name: Dry-run npm publish (manual dispatch default)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish != 'true' }}
        run: npm publish --access public --dry-run

      - name: Publish to npm
        if: ${{ github.event_name == 'release' || inputs.publish == 'true' }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
